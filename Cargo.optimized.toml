[package]
name = "ant"
version = "0.9.0"
edition = "2021"
description = "AI Orchestration System with Hybrid Memory, External Agents, and TUI"
authors = ["ANT Team"]

[dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"

# Database & AI
duckdb = { version = "1.1", features = ["bundled", "vtab"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
fastembed = "4.0"

# TUI (стабильные версии)
ratatui = "0.26"
crossterm = "0.27"

# WASM Sandboxing
wasmtime = "14.0"
wasmtime-wasi = "14.0"
cap-std = "2.0"
toml = "0.8"

# Browser & System
headless_chrome = "1.0"
sysinfo = "0.30"
dirs = "5.0"
dunce = "1.0"
regex = "1.10"

# Futures
futures-util = "0.3"

# Git (опционально, для Git навыка)
# git2 = { version = "0.18", optional = true }

[features]
default = []
git = ["git2"]

# Профили оптимизации
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
